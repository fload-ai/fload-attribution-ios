name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: A tag is the release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ "$GITHUB_REF_NAME" = "$(tr -d '[:space:]' < VERSION)" ] \
            || { echo "::error::tag $GITHUB_REF_NAME but VERSION is $(cat VERSION)"; exit 1; }

      - name: Unit tests (iOS simulator)
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')"
          xcodebuild test -scheme FloadAttribution -destination "id=$device" -derivedDataPath build/dd
